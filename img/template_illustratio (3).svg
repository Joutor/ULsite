<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" fill="none">
    <defs>
        <!-- лёгкий “точечный” фон -->
        <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="4" cy="4" r="1.2" fill="#B9B2F7" opacity="0.55"/>
            <circle cx="16" cy="12" r="1.2" fill="#B9B2F7" opacity="0.35"/>
            <circle cx="10" cy="20" r="1.2" fill="#B9B2F7" opacity="0.25"/>
        </pattern>

        <!-- тень “вверх-влево” (как будто свет снизу-справа) -->
        <filter id="shadowUL" x="-80" y="-80" width="960" height="760" filterUnits="userSpaceOnUse">
            <feDropShadow dx="-15" dy="-15" stdDeviation="8" flood-color="#1E1B2E" flood-opacity="0.13"/>
        </filter>
    </defs>

    <!-- фон -->
    <rect x="16" y="18" width="768" height="500" fill="url(#dots)" opacity="0.22"/>

    <!-- основное “окно” -->
    <rect x="60" y="55" width="680" height="430" rx="12" fill="#F5F4F9" filter="url(#shadowUL)"/>

    <!-- верхняя панель -->
    <rect x="76" y="74" width="648" height="46" rx="10" fill="#FFFFFF" filter="url(#shadowULSoft)"/>
    <circle cx="96" cy="97" r="7" fill="#5C35F9"/>
    <rect x="112" y="90" width="250" height="14" rx="7" fill="#E1DEFA"/>
    <circle cx="694" cy="97" r="8" stroke="#7BB1FF" stroke-width="2"/>
    <path d="M699 102 L706 109" stroke="#7BB1FF" stroke-width="2" stroke-linecap="round"/>

    <!-- боковая колонка -->
    <rect x="76" y="132" width="172" height="337" rx="10" fill="#E1DEFA" filter="url(#shadowULSoft)"/>
    <rect x="92" y="152" width="140" height="12" rx="6" fill="#7BB1FF" opacity="0.9"/>
    <rect x="92" y="182" width="120" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="92" y="206" width="132" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="92" y="230" width="108" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="92" y="262" width="140" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="92" y="286" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>

    <!-- блок “SLA/дедлайны” -->
    <rect x="264" y="132" width="460" height="337" rx="10" fill="#E1DEFA" filter="url(#shadowULSoft)"/>

    <!-- карточка 1 -->
    <rect x="284" y="152" width="420" height="86" rx="10" fill="#FFFFFF" filter="url(#shadowULSoft)"/>
    <rect x="284" y="152" width="420" height="6" rx="3" fill="#5C35F9"/>
    <circle cx="308" cy="188" r="14" fill="#E1DEFA"/>
    <rect x="330" y="170" width="170" height="10" rx="5" fill="#7BB1FF"/>
    <rect x="330" y="188" width="210" height="8" rx="4" fill="#E1DEFA"/>
    <rect x="330" y="204" width="140" height="8" rx="4" fill="#E1DEFA"/>

    <!-- дедлайн (нормальный) -->
    <g>
        <rect x="584" y="172" width="104" height="28" rx="14" fill="#E1DEFA"/>
        <!-- мини-календарь -->
        <rect x="594" y="178" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#7BB1FF" stroke-width="1.5"/>
        <rect x="594" y="178" width="16" height="4" rx="2" fill="#7BB1FF"/>
        <path d="M603 185 L603 190" stroke="#7BB1FF" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M599 187 L607 187" stroke="#7BB1FF" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="615" y="182" width="62" height="10" rx="5" fill="#7BB1FF" opacity="0.9"/>
    </g>

    <!-- карточка 2 -->
    <rect x="284" y="254" width="420" height="86" rx="10" fill="#FFFFFF" filter="url(#shadowULSoft)"/>
    <rect x="284" y="254" width="420" height="6" rx="3" fill="#FF9292"/>
    <circle cx="308" cy="290" r="14" fill="#E1DEFA"/>
    <rect x="330" y="272" width="190" height="10" rx="5" fill="#7BB1FF"/>
    <rect x="330" y="290" width="220" height="8" rx="4" fill="#E1DEFA"/>
    <rect x="330" y="306" width="160" height="8" rx="4" fill="#E1DEFA"/>

    <g>
        <rect x="568" y="274" width="120" height="28" rx="14" fill="#FFE1DE"/>
        <!-- мини-часы -->
        <circle cx="602" cy="288" r="8" fill="#FFFFFF" stroke="#FF5E4D" stroke-width="1.5"/>
        <path d="M602 288 L602 283" stroke="#FF5E4D" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M602 288 L606 290" stroke="#FF5E4D" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="615" y="283" width="64" height="10" rx="5" fill="#FF5E4D" opacity="0.85"/>
    </g>

    <!-- карточка 3 -->
    <rect x="284" y="356" width="420" height="86" rx="10" fill="#FFFFFF" filter="url(#shadowULSoft)"/>
    <rect x="284" y="356" width="420" height="6" rx="3" fill="#FF5E4D"/>
    <circle cx="308" cy="392" r="14" fill="#E1DEFA"/>
    <rect x="330" y="374" width="160" height="10" rx="5" fill="#7BB1FF"/>
    <rect x="330" y="392" width="240" height="8" rx="4" fill="#E1DEFA"/>
    <rect x="330" y="408" width="150" height="8" rx="4" fill="#E1DEFA"/>

    <g>
        <rect x="558" y="376" width="130" height="28" rx="14" fill="#FFD6D1"/>
        <path d="M578 390 L585 397 L599 382" stroke="#FF5E4D" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round"/>
        <rect x="605" y="385" width="74" height="10" rx="5" fill="#FF5E4D"/>
    </g>

    <!-- крупная “иконка SLA” -->
    <g filter="url(#shadowULSoft)">
        <circle cx="676" cy="150" r="26" fill="#5C35F9"/>
        <circle cx="676" cy="150" r="16" fill="#FFFFFF" opacity="0.95"/>
        <path d="M676 150 L676 141" stroke="#5C35F9" stroke-width="3" stroke-linecap="round"/>
        <path d="M676 150 L684 154" stroke="#5C35F9" stroke-width="3" stroke-linecap="round"/>
        <circle cx="676" cy="150" r="2.8" fill="#5C35F9"/>
    </g>

    <!-- маленькие “SLA” индикаторы -->
    <rect x="264" y="122" width="92" height="18" rx="9" fill="#5C35F9"/>
    <rect x="272" y="127" width="46" height="8" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="322" y="127" width="26" height="8" rx="4" fill="#FFFFFF" opacity="0.65"/>
</svg>
